name: Tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16.6
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: bybitbot
          POSTGRES_DB: bybitbot
        ports: ["55432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d bybitbot"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      BYBITBOT_TESTING: "1"
      BYBITBOT_TEST_DSN: postgresql+psycopg://postgres:bybitbot@127.0.0.1:55432/bybitbot
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Install locked tooling
        run: python -m pip install uv==0.9.9
      - name: Install locked project
        run: uv sync --frozen --extra dev
      - name: Lint
        run: uv run ruff check src tests deploy alembic research/bybit_spot_backtest research/cointegration research/test_cointegration.py
      - name: Test with synthetic credentials and blocked exchange HTTP
        run: uv run pytest -q
      - name: Verify console command feedback
        run: node --test tests/console_ui.test.mjs
      - name: Verify spot backtest console behaviour
        run: node --test research/bybit_spot_backtest/tests/test_ui.cjs
      - name: Verify migration convergence
        env:
          BYBITBOT_DB_DSN: postgresql+psycopg://postgres:bybitbot@127.0.0.1:55432/bybitbot
        run: |
          uv run alembic upgrade head
          uv run alembic check
