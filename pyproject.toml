[project]
name = "bybitbot"
version = "0.1.0"
description = "Bybit 现货与期权自动交易系统 —— 需求文档 v0.1 的 M0~M3 实现"
requires-python = ">=3.12,<3.13"
dependencies = [
    "httpx>=0.28,<0.29",
    "websockets>=14,<16",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "sqlalchemy[asyncio]>=2.0.36",
    "alembic>=1.14",
    "psycopg[binary]>=3.2",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "PyYAML>=6.0.2,<7",
    "jinja2>=3.1",
    "itsdangerous>=2.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "pytest-cov>=6.0",
    "hypothesis>=6.131",
    "ruff>=0.9",
]

[project.scripts]
bybitbot = "bybitbot.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bybitbot"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "S", "C4", "RET", "SIM"]
ignore = [
    "S101",  # assert 在测试里是正常的
    "B008",  # FastAPI Depends() 是惯用法
    "SIM108", # 三元表达式有时反而更难读
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S311"]
"deploy/**" = ["S106"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests", "research"]
filterwarnings = ["error::DeprecationWarning:bybitbot.*"]

[tool.coverage.run]
source = ["src/bybitbot"]
